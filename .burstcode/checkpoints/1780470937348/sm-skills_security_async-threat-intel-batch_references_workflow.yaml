workflowId: async-threat-intel-batch
name: Async Threat Intel Batch
nodes:
  - nodeId: prepare_input
    name: Prepare Input
    type: TASK
    taskRef: async_job.prepare
    taskParams:
      handlerKey: packaged_skill
      completionMode: POLL
      handlerConfig:
        skillRef: current_workflow
        submitAction: submit_batch
        queryAction: query_batch
        fetchAction: fetch_result
        cancelAction: cancel_batch
    dependsOn: []
    failurePolicy: FAIL_FAST

  - nodeId: submit_job
    name: Submit Job
    type: TASK
    taskRef: async_job.submit
    taskParams:
      handlerKey: packaged_skill
    dependsOn:
      - prepare_input
    failurePolicy: FAIL_FAST

  - nodeId: suspend_run
    name: Suspend Run
    type: TASK
    taskRef: run.suspend
    taskParams:
      reason: async_job_waiting
      message: 任务已提交，正在等待外部系统处理完成。
    dependsOn:
      - submit_job
    failurePolicy: FAIL_FAST

  - nodeId: finalize_job
    name: Finalize Job
    type: TASK
    taskRef: async_job.finalize
    taskParams:
      includeArtifactHint: true
      failOnError: false
    dependsOn:
      - suspend_run
    failurePolicy: FAIL_FAST
